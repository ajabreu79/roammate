{% extends 'base.html' %}

{% block head %}<title>RoamMate</title>{% endblock %}

{% block content %}
<div class="main-container">
    <h2>Welcome back, {{ current_user.first_name }}</h2>
    <div class="flash-messages">
        {% for message in get_flashed_messages() %}
        <p class="flash-message">{{ message }}</p>
        {% endfor %}
    </div>
    <p><a href="{{ url_for('main.profile', user_id=current_user.id) }}">Your profile</a></p>
</div>
{% endblock %}
