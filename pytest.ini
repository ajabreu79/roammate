[pytest]
testpaths = tests

# --cov on every run so a coverage number is always part of the output; there
# is no separate "coverage mode" to remember.  app/static and app/templates
# are not Python, and scripts/ holds one-off operator tools rather than
# anything the suite drives.
addopts =
    --cov=app
    --cov-report=term-missing
    --cov-report=html:htmlcov
